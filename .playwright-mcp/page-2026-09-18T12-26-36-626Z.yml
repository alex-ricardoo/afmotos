          - generic [ref=f4e73]:
            - heading "1. Objeto e funcionamento da plataforma" [level=2] [ref=f4e74]:
              - generic [ref=f4e75]: "1."
              - generic [ref=f4e76]: Objeto e funcionamento da plataforma
            - generic [ref=f4e77]:
              - paragraph [ref=f4e78]:
                - text: Estes Termos e Condições Gerais de Uso ("Termos") regem a navegação, contratação de serviços, compra de créditos e utilização das ferramentas disponibilizadas pela
                - strong [ref=f4e79]: AF Motos
                - text: em seu website e Portal do Cliente.
              - paragraph [ref=f4e80]: A plataforma opera como um ecossistema digital para anúncio, venda, consignação e locação de motocicletas, além de fornecer serviços especializados de consulta veicular por placa e emissão de laudos de procedência.
              - paragraph [ref=f4e81]: Ao criar uma conta ou utilizar os serviços disponíveis, o usuário declara ter lido, compreendido e aceito integralmente estes Termos e a nossa Política de Privacidade.
          - generic [ref=f4e82]:
            - heading "2. Cadastro e responsabilidade pelas informações" [level=2] [ref=f4e83]:
              - generic [ref=f4e84]: "2."
              - generic [ref=f4e85]: Cadastro e responsabilidade pelas informações
            - generic [ref=f4e86]:
              - paragraph [ref=f4e87]: Para acessar a área do cliente e usufruir dos serviços de consulta e créditos, o usuário deve realizar cadastro fornecendo dados verdadeiros, exatos e atualizados.
              - paragraph [ref=f4e88]: É expressamente vedada a criação de contas com dados falsos, documentos de terceiros ou identidades simuladas.
              - paragraph [ref=f4e89]: O usuário é o único responsável pela guarda de suas credenciais de acesso (e-mail e senha). Qualquer ação realizada na plataforma com credenciais válidas do usuário será juridicamente imputada a ele. Em caso de perda, furto ou suspeita de uso indevido, o usuário deve alterar a senha imediatamente ou notificar o suporte da AF Motos.
          - generic [ref=f4e90]:
            - heading "3. Uso legítimo de consultas de histórico veicular" [level=2] [ref=f4e91]:
              - generic [ref=f4e92]: "3."
              - generic [ref=f4e93]: Uso legítimo de consultas de histórico veicular
            - generic [ref=f4e94]:
              - paragraph [ref=f4e95]: As consultas de histórico veicular por placa destinam-se exclusivamente a apoiar tomadas de decisão comerciais lícitas, verificação preventiva de procedência mecânica/documental e proteção contra fraudes em negociações automotivas.
              - paragraph [ref=f4e96]: O usuário compromete-se a utilizar os dados obtidos em consonância com a boa-fé e com os princípios da Lei Geral de Proteção de Dados (LGPD). É estritamente proibido o uso das informações para perseguição pessoal, vigilância ilícita, assédio ou qualquer atividade lesiva a terceiros.
          - generic [ref=f4e97]:
            - heading "4. Proibição de uso ilícito, fraude, scraping e engenharia reversa" [level=2] [ref=f4e98]:
              - generic [ref=f4e99]: "4."
              - generic [ref=f4e100]: Proibição de uso ilícito, fraude, scraping e engenharia reversa
            - generic [ref=f4e101]:
              - paragraph [ref=f4e102]: "É terminantemente vedado ao usuário:"
              - list [ref=f4e103]:
                - listitem [ref=f4e104]: Empregar robôs, spiders, crawlers, scripts automatizados ou scrapers para extração maciça de dados da plataforma.
                - listitem [ref=f4e105]: Burlar mecanismos de autenticação, taxas de limite (rate limits), tokens de compartilhamento ou permissões RLS.
                - listitem [ref=f4e106]: Praticar engenharia reversa, descompilação ou cópia indevida dos códigos-fonte e componentes da AF Motos.
                - listitem [ref=f4e107]: Revender relatórios veiculares de forma fraudulenta ou repassar acessos a terceiros não autorizados.
                - listitem [ref=f4e108]: Injetar vírus, malwares ou executar ataques de negação de serviço (DDoS) contra nossa infraestrutura.
          - generic [ref=f4e109]:
            - heading "5. Pagamentos, créditos e pacotes B2B" [level=2] [ref=f4e110]:
              - generic [ref=f4e111]: "5."
              - generic [ref=f4e112]: Pagamentos, créditos e pacotes B2B
            - generic [ref=f4e113]:
              - paragraph [ref=f4e114]: Os serviços podem ser adquiridos mediante pagamento avulso ou por meio de Pacotes de Créditos B2B disponibilizados na área do cliente.
              - paragraph [ref=f4e115]: Todos os pagamentos são intermediados de forma segura pelo gateway Mercado Pago (PIX ou Cartão de Crédito). A liberação do laudo ou a adição de saldo à carteira do usuário ocorre de forma automática e instantânea logo após a confirmação irrevogável do pagamento enviada pela instituição bancária.
              - paragraph [ref=f4e116]: Os créditos adquiridos em pacotes corporativos são de titularidade da conta contratante e possuem condições claras de vigência e consumo discriminadas no momento da compra.
          - generic [ref=f4e117]:
            - heading "6. Condições de entrega de laudos e dependência de fornecedores externos" [level=2] [ref=f4e118]:
              - generic [ref=f4e119]: "6."
              - generic [ref=f4e120]: Condições de entrega de laudos e dependência de fornecedores externos
            - generic [ref=f4e121]:
              - paragraph [ref=f4e122]: Os relatórios veiculares gerados dependem diretamente dos dados catalogados pelos órgãos públicos governamentais (Senatran, Detrans estaduais, Renajud e Polícia Rodoviária Federal) através de provedores integrados de dados.
              - paragraph [ref=f4e123]:
                - text: A
                - strong [ref=f4e124]: AF Motos
                - text: empenha os melhores recursos técnicos para processar e formatar as informações com máxima agilidade. Contudo, a plataforma atua como prestadora de tecnologia integradora e não pode ser responsabilizada por falhas, incorreções, imprecisões cadastrais ou inconsistências originadas exclusivamente nos cadastros mantidos pelos órgãos governamentais emissores.
          - generic [ref=f4e125]:
            - heading "7. Indisponibilidade temporária, retries e estornos" [level=2] [ref=f4e126]:
              - generic [ref=f4e127]: "7."
              - generic [ref=f4e128]: Indisponibilidade temporária, retries e estornos
            - generic [ref=f4e129]:
              - paragraph [ref=f4e130]: Se por motivo de instabilidade passageira nos servidores dos órgãos de trânsito uma consulta paga sofrer atraso, nosso sistema ativará automaticamente uma rotina resiliente de retentativas (retries) para concluir a entrega do laudo.
              - paragraph [ref=f4e131]:
                - strong [ref=f4e132]: "Política de Estorno:"
                - text: Caso ocorra uma falha técnica definitiva e permanente do provedor sem a entrega do laudo solicitado, o valor pago será integralmente estornado via Mercado Pago ou o crédito consumido será imediatamente restabelecido na carteira do cliente.
              - paragraph [ref=f4e133]: Não haverá estorno caso o laudo tenha sido regularmente processado e disponibilizado para download, mesmo que o veículo pesquisado não possua débitos ou restrições registradas na base oficial.
          - generic [ref=f4e134]:
            - heading "8. Limitações do serviço e boa-fé" [level=2] [ref=f4e135]:
              - generic [ref=f4e136]: "8."
              - generic [ref=f4e137]: Limitações do serviço e boa-fé
            - paragraph [ref=f4e139]: O relatório veicular constitui instrumento complementar e informativo para auxílio em negociações. Ele não substitui a vistoria presencial da moto, checagem física de gravação de chassi/motor em oficina especializada ou a consulta formal junto ao Detran no ato de transferência civil do veículo.
