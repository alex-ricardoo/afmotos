          - generic [ref=f4e147]:
            - heading "10. Suporte e canais de atendimento" [level=2] [ref=f4e148]:
              - generic [ref=f4e149]: "10."
              - generic [ref=f4e150]: Suporte e canais de atendimento
            - paragraph [ref=f4e152]: Disponibilizamos canais de suporte técnico e comercial através do WhatsApp oficial e e-mail institucional durante o horário comercial para esclarecimento de dúvidas sobre laudos, compras de crédito e motos em estoque.
