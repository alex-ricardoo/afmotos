                - text: .
          - generic [ref=f5e292]:
            - heading "20. Crianças e adolescentes" [level=2] [ref=f5e293]:
              - generic [ref=f5e294]: "20."
              - generic [ref=f5e295]: Crianças e adolescentes
            - paragraph [ref=f5e297]: Nossos serviços digitais são direcionados a pessoas com capacidade civil plena ou jovens a partir de 14 anos com assistência para consultas e pesquisas. Não realizamos coleta intencional de dados de crianças menores de 12 anos. Caso identifique cadastro indevido de menor de idade, favor contatar nossa equipe para imediata exclusão.
          - generic [ref=f5e298]:
            - heading "21. Transferências internacionais de dados" [level=2] [ref=f5e299]:
              - generic [ref=f5e300]: "21."
              - generic [ref=f5e301]: Transferências internacionais de dados
            - paragraph [ref=f5e303]: Nossos provedores de tecnologia em nuvem (Supabase e Vercel) operam servidores em centros de dados seguros localizados em conformidade com normas internacionais de proteção de dados, mediante salvaguardas contratuais adequadas e mecanismos de criptografia de ponta a ponta.
          - generic [ref=f5e304]:
            - heading "22. Alterações nesta política" [level=2] [ref=f5e305]:
              - generic [ref=f5e306]: "22."
              - generic [ref=f5e307]: Alterações nesta política
            - paragraph [ref=f5e309]: Esta Política de Privacidade poderá ser revisada periodicamente para acompanhar novas funcionalidades ou exigências legais. Quando houver alterações materiais que impactem os direitos dos usuários, exibiremos um aviso destacado no Portal do Cliente no próximo acesso com indicação clara da nova versão para ciência e aceite.
          - generic [ref=f5e310]:
            - heading "23. Contato do controlador e encarregado de dados" [level=2] [ref=f5e311]:
              - generic [ref=f5e312]: "23."
              - generic [ref=f5e313]: Contato do controlador e encarregado de dados
            - generic [ref=f5e315]:
              - paragraph [ref=f5e316]: "Para exercer seus direitos ou esclarecer quaisquer dúvidas sobre o tratamento de seus dados, contate nosso canal oficial:"
              - generic [ref=f5e317]:
                - paragraph [ref=f5e318]:
                  - strong [ref=f5e319]: "Controlador:"
                  - text: AF Motos
