            - strong [ref=f5e60]: AF Motos
            - text: preza pela máxima transparência, lealdade e segurança. Todas as informações coletadas possuem finalidades legítimas, bases legais explícitas sob a LGPD e são protegidas por rigorosas salvaguardas técnicas.
